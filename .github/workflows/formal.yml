name: formal

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  formal:
    name: Formal verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the design
        uses: actions/checkout@v4

      - name: Install the OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite

      - name: Show tool versions
        run: |
          yosys --version
          ghdl --version | head -1
          sby --version

      - name: Run formal verification
        run: make -C formal -k

      # A failed property leaves a counterexample trace behind; without it the
      # only thing in the log is which property failed at which depth.
      - name: Upload counterexample traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: formal-traces
          path: |
            formal/*/logfile.txt
            formal/*/engine_*/*.vcd
          if-no-files-found: ignore
