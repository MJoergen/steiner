name: sim

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  sim:
    name: Simulation (${{ matrix.n }}, ${{ matrix.k }}, ${{ matrix.t }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # One job for each parameter set with a known result
    strategy:
      fail-fast: false
      matrix:
        include:
          - { n: 7, k: 3, t: 2 }
          - { n: 9, k: 3, t: 2 }
          - { n: 8, k: 4, t: 3 }

    steps:
      - name: Check out the design
        uses: actions/checkout@v4

      # GHDL comes from the same pinned OSS CAD Suite as in the formal workflow,
      # so both workflows use the same tool versions.
      - name: Install the OSS CAD Suite
        env:
          OSS_CAD_SUITE_DATE: "2026-08-24"
        run: |
          d="$OSS_CAD_SUITE_DATE"
          curl -sSL -o oss-cad-suite.tgz \
            "https://github.com/YosysHQ/oss-cad-suite-build/releases/download/$d/oss-cad-suite-linux-x64-${d//-/}.tgz"
          tar xzf oss-cad-suite.tgz
          rm oss-cad-suite.tgz
          echo "$PWD/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: ghdl --version | head -1

      # The testbench checks each solution and the number of solutions, and
      # "make sim" fails if any check fails
      - name: Run the simulation
        run: make sim N=${{ matrix.n }} K=${{ matrix.k }} T=${{ matrix.t }}

      # The solutions must also come out exactly as in the results file, in the
      # same order
      - name: Compare with the known result
        run: diff steiner_tb.txt result_${{ matrix.n }}_${{ matrix.k }}_${{ matrix.t }}.txt
