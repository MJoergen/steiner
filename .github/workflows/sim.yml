name: sim

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  sim:
    name: Simulation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the design
        uses: actions/checkout@v4

      # GHDL comes from the same pinned OSS CAD Suite as in the formal workflow,
      # so both workflows use the same tool versions.
      - name: Install the OSS CAD Suite
        env:
          OSS_CAD_SUITE_DATE: "2026-08-24"
        run: |
          d="$OSS_CAD_SUITE_DATE"
          curl -sSL -o oss-cad-suite.tgz \
            "https://github.com/YosysHQ/oss-cad-suite-build/releases/download/$d/oss-cad-suite-linux-x64-${d//-/}.tgz"
          tar xzf oss-cad-suite.tgz
          rm oss-cad-suite.tgz
          echo "$PWD/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          ghdl --version | head -1
          python3 --version

      # Simulates each parameter set in CHECK in the Makefile. The testbench
      # checks that each solution is a Steiner system, and the solutions must
      # be exactly those of steiner_ref.py and of the results files.
      - name: Run the simulations
        run: make check
