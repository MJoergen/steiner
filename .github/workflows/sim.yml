name: sim

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  sim:
    name: Simulation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the design
        uses: actions/checkout@v4

      - name: Install the OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite

      - name: Show tool versions
        run: |
          ghdl --version | head -1
          python3 --version

      # Simulates each parameter set in CHECK in the Makefile. The testbench
      # checks that each solution is a Steiner system, and the solutions must
      # be exactly those of steiner_ref.py and of the results files. The text
      # from steiner2uart.vhd must be exactly that of steiner_ref.py --text.
      - name: Run the simulations
        run: make check

      # Checks that the 7-segment display shows the right digits, with the
      # leading zeros blank
      - name: Run the display simulation
        run: make display
